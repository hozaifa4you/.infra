services:
  pg-vector:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg-vector-data:/var/lib/postgresql
      - ./pg-vector.init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    networks:
      - pg-vector-net

  pg-admin:
    image: dpage/pgadmin4:9.18.0
    container_name: pg-admin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: root@pg.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - pg-vector
    networks:
      - pg-vector-net

volumes:
  pg-vector-data:
networks:
  pg-vector-net:
